<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>系统安全提示</title>
    <style>
        body { 
            background-color: #e5e5e5; 
            margin: 0; 
            font-family: "Microsoft YaHei", sans-serif; 
            height: 100vh;
            /* 去掉居中代码，让弹窗可以随便跑 */
            overflow: hidden; 
        }
        
        /* 遮罩层 */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.1);
            display: none; z-index: 9998;
        }

        /* 假弹窗样式 */
        .fake-dialog {
            background-color: white;
            width: 380px;
            border: 1px solid #999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-radius: 4px;
            overflow: hidden;
            position: fixed; /* 固定定位，方便JS随机调整 */
            display: none; /* 默认隐藏 */
            z-index: 9999;
            /* 注意：这里去掉了之前的居中 transform */
        }

        .dialog-title {
            background-color: #f0f0f0;
            padding: 10px 15px;
            font-size: 14px;
            color: #333;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
        }

        .close-btn { color: #666; cursor: pointer; }
        .close-btn:hover { color: red; }

        .dialog-content {
            padding: 30px 20px;
            display: flex;
            align-items: center;
            font-size: 16px;
            color: #333;
        }

        .info-icon {
            display: inline-block;
            width: 24px; height: 24px;
            background-color: #0078D7;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-weight: bold;
            font-family: serif;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .dialog-footer {
            background-color: #f5f5f5;
            padding: 15px;
            text-align: center;
            border-top: 1px solid #eee;
        }

        .ok-btn {
            padding: 6px 30px;
            background-color: #e1e1e1;
            border: 1px solid #adadad;
            border-radius: 2px;
            font-size: 14px;
            cursor: pointer;
        }
        .ok-btn:hover { background-color: #d1d1d1; }
    </style>
</head>
<body>

    <div id="overlay"></div>
    <div id="dialog-container"></div>
        <script>
        let clickCount = 0; 
        const MAX_CLICKS = 100; // 【在这里调次数】

        function createDialogHTML(index) {
            return `
                <div class="dialog-title">
                    <span>提示 (${index}/${MAX_CLICKS})</span>
                    <span class="close-btn" onclick="handleClose(${index})">✕</span>
                </div>
                <div class="dialog-content">
                    <span class="info-icon">i</span>
                    <span>请注意安全，谨防诈骗！</span>
                </div>
                <div class="dialog-footer">
                    <button class="ok-btn" onclick="handleClose(${index})">确定</button>
                </div>
            `;
        }

        window.onload = function() {
            document.getElementById('overlay').style.display = 'block';
            createNewDialog(1);
        };

        function createNewDialog(index) {
            if (index > MAX_CLICKS) return;

            const container = document.getElementById('dialog-container');
            container.innerHTML = ''; 

            const dialog = document.createElement('div');
            dialog.className = 'fake-dialog';
            dialog.id = 'dialog-' + index;
            dialog.innerHTML = createDialogHTML(index);
            
            // 🎯 【核心代码：随机位置计算】
            // 计算屏幕能容纳弹窗的最大宽高，减去弹窗本身的大小，防止弹窗跑出屏幕外
            const maxX = window.innerWidth - 400; 
            const maxY = window.innerHeight - 200;
            
            // 随机生成 X 和 Y 坐标
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            // 应用随机位置
            dialog.style.left = randomX + 'px';
            dialog.style.top = randomY + 'px';
            
            dialog.style.display = 'block'; 

            container.appendChild(dialog);
        }

        function handleClose(index) {
            clickCount++; 

            if (clickCount < MAX_CLICKS) {
                // 还没点完，弹下一个（位置会重新随机）
                createNewDialog(clickCount + 1);
            } else {
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('dialog-container').innerHTML = '';
                alert("恭喜你！成功完成了 " + MAX_CLICKS + " 次防诈骗确认！");
            }
        }
    </script>
</body>
</html>
